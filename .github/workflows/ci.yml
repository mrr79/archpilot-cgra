name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]  # actualizado desde 3.9/3.10/3.11

    steps:
      - uses: actions/checkout@v4          # era v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5      # era v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Flake8
        run: flake8 archpilot_cgra/ tests/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=archpilot_cgra --cov-report=term-missing